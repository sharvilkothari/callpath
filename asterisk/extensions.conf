[general]
static=yes
writeprotect=yes
clearglobalvars=yes

[callpath-header]
exten => s,1,Set(__CALLPATH_RUN=${PJSIP_HEADER(read,X-CallPath-Run)})
 same => n,Set(__CALLPATH_SIP_ID=${CHANNEL(pjsip,call-id)})
 same => n,UserEvent(CallPathCorrelation,RunID:${CALLPATH_RUN},SIPCallID:${CALLPATH_SIP_ID})
 same => n,Return()

[callpath]
exten => 7000,1,Gosub(callpath-header,s,1)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
exten => 7001,1,Gosub(callpath-header,s,1)
 same => n,Answer()
 same => n,Echo()
 same => n,UserEvent(CallPathDTMF,RunID:${CALLPATH_RUN},SIPCallID:${CALLPATH_SIP_ID})
 same => n,Wait(12)
 same => n,Hangup()
exten => 7002,1,Gosub(callpath-header,s,1)
 same => n,Set(__TRANSFER_CONTEXT=callpath-target)
 same => n,Dial(Local/7004@callpath-target/n,12)
 same => n,Hangup()

[callpath-target]
exten => 7003,1,Answer()
 same => n,UserEvent(CallPathTransfer,RunID:${CALLPATH_RUN},SIPCallID:${CALLPATH_SIP_ID})
 same => n,Wait(2)
 same => n,Hangup()
exten => 7004,1,Answer()
 same => n,Wait(12)
 same => n,Hangup()
